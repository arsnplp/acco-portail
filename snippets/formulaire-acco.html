<!--
  Formulaire de contact Acco — à coller dans la page Contact d'un site client.
  1. Remplacez SITE_KEY par la clé du site (admin Acco → Sites → le site → « Clé formulaire »).
  2. Remplacez TURNSTILE_SITE_KEY par la site key Cloudflare Turnstile (ou retirez le bloc Turnstile en dev).
  3. Adaptez les classes CSS à la charte du site.
-->
<form id="acco-form" action="https://app.acco-lab.fr/api/forms/SITE_KEY" method="post" novalidate>
  <label>Votre nom <input name="name" required autocomplete="name"></label>
  <label>Téléphone <input name="phone" type="tel" autocomplete="tel"></label>
  <label>Email <input name="email" type="email" autocomplete="email"></label>
  <label>Objet
    <select name="type">
      <option>Demande de devis</option>
      <option>Prise de rendez-vous</option>
      <option>Question</option>
      <option>Autre</option>
    </select>
  </label>
  <label>Votre message <textarea name="message" rows="5" required></textarea></label>

  <!-- Champ piège anti-robots : doit rester vide et invisible -->
  <div style="position:absolute;left:-9999px" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>

  <!-- Cloudflare Turnstile -->
  <div class="cf-turnstile" data-sitekey="TURNSTILE_SITE_KEY" data-theme="light"></div>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <button type="submit">Envoyer</button>
  <p id="acco-form-status" role="status"></p>
</form>

<script>
(function () {
  var form = document.getElementById("acco-form");
  var status = document.getElementById("acco-form-status");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; status.textContent = "Envoi…";
    var data = new FormData(form);
    data.set("pageUrl", location.href);
    fetch(form.action, { method: "POST", body: data })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.ok) { form.reset(); status.textContent = "Merci ! Nous vous répondons très vite."; }
        else { status.textContent = "Oups : " + (j.error || "réessayez"); btn.disabled = false; }
        if (window.turnstile) window.turnstile.reset();
      })
      .catch(function () { status.textContent = "Connexion impossible, réessayez."; btn.disabled = false; });
  });
})();
</script>
